# ui.client.task.yaml — normalized by aose compile. Edit the source artifacts, not this header.
task:
  target_module: ui/client
  context:
    constitution_articles:
      - ART-01
      - ART-02
      - ART-04
      - ART-05
    spec: ui.client.spec.yaml
    upstream_exports:
      core/engine:
        - LINES
        - init
        - checkWinner
        - playMove
        - getBestMove
  deliverables:
    - main.js
    - index.html
    - style.css
    - test/main.test.js
  execution_gate:
    command: node --test test/main.test.js
    success_criteria: Exit code 0 with one passing test per verification scenario,
      using a DOM double rather than a real browser.
    timeout_minutes: 10
  budget:
    max_attempts: 2
