system:
  name: Freelance-Dashboard
  constitution: constitution.yaml
  scope_class: architectural
  boundaries:
    - domain: core/opportunity
      responsibility: The opportunity record and its pipeline state machine. Pure; no I/O.
      depends_on: []
      exports: [STAGES, createOpportunity, advance, canAdvance, isTerminal]
      spec: core.opportunity.spec.yaml
      task: core.opportunity.task.yaml
    - domain: core/match
      responsibility: Score an opportunity against a freelancer profile and explain the score. Pure; no I/O.
      depends_on: [core/opportunity]
      exports: [scoreOpportunity, rankOpportunities]
      spec: core.match.spec.yaml
      task: core.match.task.yaml
    - domain: core/parse
      responsibility: Turn a pasted job post into an opportunity, naming every field it could not read. Pure; no I/O.
      depends_on: [core/opportunity]
      exports: [parsePost, parseRate, parseBudget, extractSkills]
      spec: core.parse.spec.yaml
      task: core.parse.task.yaml
    - domain: infra/feeds
      responsibility: Fetch allowlisted job feeds through an injected fetch, normalize them to opportunities and deduplicate.
      depends_on: [core/opportunity, core/parse]
      exports: [SOURCES, runScout, normalizeItem, dedupeKey]
      spec: infra.feeds.spec.yaml
      task: infra.feeds.task.yaml
    - domain: infra/store
      responsibility: Persistence for opportunities, profile and scout history, with schema migration, over whichever backend the host offers — node:sqlite, browser storage, or memory.
      depends_on: [core/opportunity]
      exports: [openStore, saveOpportunity, listOpportunities, saveProfile, loadProfile]
      spec: infra.store.spec.yaml
      task: infra.store.task.yaml
    - domain: ui/client
      responsibility: The dashboard surfaces. Pipeline board, scout inbox, opportunity detail, profile.
      depends_on: [core/opportunity, core/match, infra/store]
      exports: [App, PipelineBoard, ScoutInbox, OpportunityDetail, ProfileForm, toBoardColumns, toInboxRows, emptyStateFor]
      spec: ui.client.spec.yaml
      task: ui.client.task.yaml
invariants: [ART-01, ART-02, ART-03, ART-04, ART-05, ART-06, ART-07, ART-08]
decisions:
  - id: DEC-01
    statement: Every contract declares a precondition and a postcondition, not only a signature.
    rationale: Generating preconditions alongside postconditions measurably reduces false alarms when contracts are checked, so both are required rather than optional.
    alternatives: [Postconditions only, Prose descriptions only]
    sources: [https://arxiv.org/abs/2510.12702]
  - id: DEC-02
    statement: Decompose into a dependency DAG of pure cores plus thin adapters, and build in topological order.
    rationale: Independent lines of work converge on decomposing into a dependency structure and planning per node rather than generating a system in one pass.
    alternatives: [One module per screen, A single service with internal layering]
    sources: [https://arxiv.org/abs/2309.12499]
  - id: DEC-03
    statement: The scout injects its fetch function rather than calling the network directly.
    rationale: Normalization, deduplication and scoring stay deterministic and gate-testable offline, and the only network edge is a single substitutable seam.
    alternatives: [Direct fetch inside the domain, A recorded-cassette HTTP layer]
    sources: []
  - id: DEC-04
    statement: Source access is governed by the feed_sources allowlist in the constitution, and Upwork is excluded until API access is granted.
    rationale: Its terms prohibit scraping and its API needs approval, so the allowlist encodes the legal boundary where a linter can enforce it rather than where a developer must remember it.
    alternatives: [Scrape the public search pages, Ship with no sources at all]
    sources: []
  - id: DEC-05
    statement: The surface is built against a frozen L.S.Design handoff rather than styled during implementation.
    rationale: A human approves the visual direction on real screens once, and the builder implements what was approved instead of relitigating it, which is what keeps a token system from drifting.
    alternatives: [Style during implementation, Apply a component library default theme]
    sources: []
  - id: DEC-06
    statement: The store selects a persistence backend from its host and reaches the
      node-only one through a dynamic import, so one module serves both the CLI and
      the browser surface.
    rationale: >-
      ui/client is browser-targeted and depends on infra/store. While the store
      declared "esm-only, node24" the shipped bundle opened with
      `import{DatabaseSync}from"node:sqlite"` and no browser could load it — and
      neither gate could see it, because a bundler externalises specifiers it does
      not recognise and the unit tests run in node, where that module is real. A
      static import is resolved by a bundler whether or not it ever executes, so the
      host check has to guard an `import()`, not an `if`. Keeping one module behind
      one contract also keeps ART-05 honest: every backend here is local, and the
      surface cannot quietly acquire a hosted one.
    alternatives:
      - Keep the store node-only and give ui/client its own browser store — two
        implementations of one contract, drifting apart, with migrations to write twice
      - Put a port in ui/client and inject the node store — correct, but it moves the
        host decision into the surface and leaves the browser case unimplemented
      - Persist nothing in the browser and treat the CLI as the only real client —
        contradicts the premise that the dashboard is the product
    sources: []
  - id: DEC-07
    statement: The surface is client-rendered, so its initial paint requires scripting;
      the contract's "Without scripting" column is read as a claim about component
      behaviour once loaded, not about first paint.
    rationale: >-
      The studio's lint-build reports that the built page renders zero characters
      with scripting disabled, and that is accurate. It is also inherent to the
      declared target stack: target_stack.json says vite-react, and a
      client-rendered SPA has nothing to paint before its bundle runs. The
      contradiction was declared on both sides — a "Without scripting" column in
      DESIGN.md and a client-rendered stack — and is recorded here rather than
      left to be rediscovered.

      Prerendering is the alternative and it is not free: ART-05 puts every row in
      local browser storage, so there is no server that knows what to render beyond
      an empty shell, and a hand-written static shell duplicates copy that then
      drifts from the components. The value on offer is a faster first paint of
      furniture, not a usable offline page.

      This is a reversible decision. If a no-script first paint is wanted, it is a
      stack change — static generation at build time — not a defect in the
      components, and it belongs in target_stack.json where the rest of the stack
      is declared.
    alternatives:
      - Prerender the shell at build time with static generation — real work, new
        dependencies, and it renders furniture rather than data
      - Hand-write a static shell in index.html for React to replace — cheap, and it
        duplicates copy that drifts from the components it mirrors
      - Move persistence to a server so there is something to render — contradicts
        ART-05, which is the premise of the product
    sources: []
