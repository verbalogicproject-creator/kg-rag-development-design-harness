meta:
  slug: freelance-dashboard
  format: aose-blueprint/v2
  generated_at: 2026-09-05T15:06:02.982Z
constitution:
  name: Freelance-Dashboard
  version: 1
  stack:
    - node24
    - esm
    - vite
    - react
    - tailwind
    - node-sqlite
  articles:
    - id: ART-01
      title: Pure cores
      rule: A core/* domain performs no I/O, no network access and no DOM access; it
        is a function of its inputs.
      enforcement: review
    - id: ART-02
      title: Errors are values
      rule: A state transition reports failure by returning a discriminated Result,
        never by throwing across a domain boundary.
      enforcement: lint
    - id: ART-03
      title: Immutable transitions
      rule: Domain state objects are never mutated in place; a transition returns a
        new object.
      enforcement: review
    - id: ART-04
      title: Every scenario is a named test
      rule: Each verification scenario maps to exactly one test whose name matches the
        scenario's test_name.
      enforcement: gate
    - id: ART-05
      title: Local first
      rule: The dashboard runs offline against local storage. No account, no hosted
        backend, no telemetry.
      enforcement: review
    - id: ART-06
      title: Fetch only what a source permits
      rule: A domain may reach a network source only if that source appears on the
        feed_sources allowlist. Scraping a site whose terms forbid programmatic
        access is prohibited regardless of technical feasibility.
      enforcement: lint
    - id: ART-07
      title: The design contract is law
      rule: A surface renders from the design contract's tokens. A raw colour literal,
        a magic pixel value or a one-off font size in a component is a defect.
      enforcement: gate
    - id: ART-08
      title: No invented content ships
      rule: Fixture values from generated screens are quarantined. Real content or an
        explicit empty state, never a plausible-looking invention.
      enforcement: lint
    - id: ART-09
      title: Scales are closed sets
      rule: Every visual value is a member of a declared scale. A one-off size,
        duration or radius is a defect even when it is expressed as a token.
      enforcement: gate
    - id: ART-10
      title: Both modes ship
      rule: Every declared contrast pair meets its target in light and in dark. A mode
        that was never measured has not shipped.
      enforcement: gate
    - id: ART-11
      title: The direction is falsifiable
      rule: Every design system declares an anti_direction, and every entry cites its
        source. A review that cannot name the item it is judging against has
        reviewed nothing.
      enforcement: review
  allowlists:
    - id: feed_sources
      rationale: "Sources that publish machine-readable listings openly and permit
        programmatic access. Upwork is deliberately absent: its terms prohibit
        scraping and its API requires approval, so it enters only as an
        authenticated source once access is granted."
      entries:
        - https://remotive.com/api/remote-jobs
        - https://remoteok.com/api
        - https://weworkremotely.com/remote-jobs.rss
        - https://hn.algolia.com/api/v1/
  budgets:
    max_attempts: 2
    max_respec: 2
    timeout_minutes: 15
    max_payload_tokens: 4000
idea:
  title: Freelance developer dashboard
  goal: Track freelance opportunities from first sighting to won or lost, and
    surface new ones worth a proposal.
  audience: A solo developer starting to freelance, working offline on their own machine
  seed_author: human
  scope_class: architectural
  success_criteria:
    - WHEN a job post is pasted in THE SYSTEM SHALL extract its title, budget,
      rate and skills, or report exactly which fields it could not read.
    - WHEN an opportunity changes stage THE SYSTEM SHALL record the transition
      and reject a stage change that the pipeline does not permit.
    - WHILE a scout run is in progress THE SYSTEM SHALL fetch only from sources
      on the feed_sources allowlist.
    - WHEN a fetched listing matches one already stored THE SYSTEM SHALL
      deduplicate it rather than creating a second opportunity.
    - WHEN listings are scored against the profile THE SYSTEM SHALL rank them by
      fit and show why each scored as it did.
    - WHERE the dashboard is opened with no data THE SYSTEM SHALL show an
      explicit empty state rather than invented sample rows.
  non_goals:
    - Invoicing, time tracking and earnings reporting, which are version two
    - Any hosted backend, account system or telemetry
    - Scraping a site whose terms prohibit programmatic access
  constraints:
    - Runs offline; a scout run is the only network activity and it is
      user-triggered
    - No credential is required to use the shipped source list
    - The pure cores must be testable without a browser or a network
  open_questions: []
  alternatives_considered:
    - option: Integrate the Upwork API directly as the primary source
      rejected_because: Its API requires approval and its terms prohibit scraping, so
        the product would be unusable until access is granted and unlawful if
        built the other way.
    - option: One store domain holding both persistence and matching logic
      rejected_because: Scoring would become untestable without a database, and the
        match rules are the part most likely to change weekly.
    - option: Background polling daemon for the scout
      rejected_because: A user-triggered run keeps network activity visible and
        consensual, and removes an entire class of rate-limit and lifecycle
        bugs.
  elicitation:
    - challenge: A parser over unstructured job posts will be wrong often. Does that
        make the paste path useless?
      response: It returns a partial result naming the fields it could not read, so
        the user corrects three fields instead of typing eleven. The contract
        makes the failure mode explicit rather than silent.
    - challenge: Why separate core/match from core/pipeline when both operate on an
        opportunity?
      response: Pipeline is a state machine whose rules are stable; match is a scoring
        heuristic that will be tuned constantly. Separating them means tuning
        the score never risks the stage transitions.
    - challenge: If the scout can only read four public feeds, is it actually useful
        on day one?
      response: Those feeds carry thousands of remote developer listings daily. The
        value is the filter, not the crawl, and the authenticated slot means a
        better source can be added without rewriting the domain.
sources:
