# core.parse.task.yaml — normalized by aose compile. Edit the source artifacts, not this header.
task:
  target_module: core/parse
  context:
    constitution_articles:
      - ART-01
      - ART-02
      - ART-04
      - ART-08
    spec: core.parse.spec.yaml
    upstream_exports:
      core/opportunity:
        - STAGES
        - createOpportunity
        - advance
        - canAdvance
        - isTerminal
  deliverables:
    - src/core/parse.js
    - test/parse.test.js
  execution_gate:
    command: node --test test/parse.test.js
    success_criteria: Exit code 0 with one passing test per verification scenario. A
      field the parser could not read appears in `missing`; it is never filled
      with a guess.
    timeout_minutes: 10
  budget:
    max_attempts: 2
