# core.match.task.yaml — normalized by aose compile. Edit the source artifacts, not this header.
task:
  target_module: core/match
  context:
    constitution_articles:
      - ART-01
      - ART-02
      - ART-04
    spec: core.match.spec.yaml
    upstream_exports:
      core/opportunity:
        - STAGES
        - createOpportunity
        - advance
        - canAdvance
        - isTerminal
  deliverables:
    - src/core/match.js
    - test/match.test.js
  execution_gate:
    command: node --test test/match.test.js
    success_criteria: Exit code 0 with one passing test per verification scenario.
      Scoring is deterministic, so a repeated run gives identical scores.
    timeout_minutes: 10
  budget:
    max_attempts: 2
