# ── ANTIPATTERNS ──────────────────────────────────────────────────────
# The negative half. `threshold` carries the composite case, where any one
# member is legitimate and only the bundle is a problem. `count_rule` carries
# the observations that are about frequency rather than presence.

antipattern:
  - id: anti_convergence_bundle
    name: The convergence composite
    summary: >-
      A warm off-white ground, a high-contrast display serif and a single clay
      accent, arriving together whatever the subject.
    threshold: 3
    severity: warn
    resolution: >-
      A brief naming any of these wins outright, and established brand truth
      wins outright. What this catches is the same combination appearing
      regardless of subject — so it demands a recorded justification, not a
      redesign.
    evidence: { source: ls-design/references/natural-color-and-humanization.md — The named bundle }

  - id: anti_terminal_cliche
    name: Decorative terminal clichés
    summary: Terminal styling the product has not earned.
    severity: warn
    condition: Correct where the product genuinely is a terminal tool.
    evidence: { source: ls-design-art-direction/references/direction-families.md — Precise technical }

  - id: anti_mono_as_costume
    name: Monospace as costume
    summary: >-
      Monospace on a navigation item or a marketing label, where the content is
      neither tabular nor numeric — signalling technical character the product
      has not earned.
    severity: warn
    evidence: { source: ls-design/references/natural-color-and-humanization.md — three motifs }

  - id: anti_trailing_arrow
    name: A trailing arrow on ordinary link text
    summary: >-
      Correct for genuinely directional navigation — next, previous, pagination.
      On an ordinary link it repeats an affordance the link already has.
    severity: info
    evidence: { source: ls-design/references/natural-color-and-humanization.md — three motifs }

  - id: anti_eyebrow_overuse
    name: Tracked all-caps eyebrow labels
    count_rule: more than one per three sections
    severity: info
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_middle_dot_metadata
    name: Middle dots separating metadata
    count_rule: two or more on a line
    severity: info
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_repeated_split
    name: Consecutive sections repeating one image-and-text split
    count_rule: more than two in a row
    severity: warn
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_too_few_layout_families
    name: Too few distinct layout families across a long page
    count_rule: fewer than four across eight sections
    severity: warn
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_one_shadow_everywhere
    name: One shadow value under every card
    summary: Or a pure-black drop shadow on a light surface.
    severity: warn
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_one_radius_everywhere
    name: One corner radius on every element
    summary: Applied regardless of hierarchy or material.
    severity: warn
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_entrance_on_every_section
    name: An entrance animation on every section
    summary: Rather than one orchestrated moment.
    count_rule: more than one unmotivated reveal
    severity: warn
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_scroll_cues
    name: Scroll cues
    summary: Text or an animated wheel telling the person the page scrolls.
    severity: info
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_fabricated_interface
    name: A fabricated product interface built from markup
    summary: A fake version string, a mock status readout, an invented screenshot in HTML.
    severity: error
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Countable observations }

  - id: anti_invented_precision
    name: Invented precision
    summary: >-
      A statistic, award or quotation with no traceable source. The most
      damaging kind of generic copy, because it reads as fact.
    severity: error
    evidence: { source: ls-design/references/interface-copy.md — Evidence }

  - id: anti_duplicate_intent_actions
    name: Two actions on one page resolving to the same intent
    summary: >-
      "Get in touch", "Contact us" and "Let's talk" are one action with three
      names. The person cannot tell the options apart.
    count_rule: two or more resolving to one intent
    severity: warn
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }

  - id: anti_long_primary_action
    name: A primary action longer than three words
    summary: Or one that wraps at any width. The action stops reading as an action.
    severity: warn
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }

  - id: anti_verb_changes_at_confirmation
    name: A verb that changes between an action and its confirmation
    summary: "`Publish` producing `Success` breaks the chain that says what happened."
    severity: warn
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }

  - id: anti_apologising_error
    name: An error that apologises or names no next step
    summary: "Emotion in place of direction. `Oops! Something went wrong.`"
    severity: warn
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }

  - id: anti_empty_state_without_action
    name: An empty state with no action in it
    summary: The moment of highest intent spent on a status message.
    severity: error
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }

  - id: anti_title_case_headings
    name: Title case headings where the product uses sentence case
    summary: Template chrome rather than a decision.
    severity: info
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }

  - id: anti_filler_latin
    name: Filler Latin, or hint text as a field's only label
    summary: Layout untested against real language; a label that vanishes on focus is not a label.
    severity: error
    evidence: { source: ls-design/references/interface-copy.md — Countable observations }
