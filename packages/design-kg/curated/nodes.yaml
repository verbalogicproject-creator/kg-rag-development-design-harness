# Curated nodes — batch one.
#
# Every node carries an evidence.source naming the file it was read from. No
# source, no node. This is the judgement layer: deciding that two things are
# rivals rather than variants, or that a rule is a threshold rather than a ban,
# cannot be extracted mechanically — so it is declared here, in the open.
#
# The differentiation test, applied to every entry: if you cannot say what this
# node distinguishes across at least five real cases, it is noise and does not
# belong. Nodes that only restate a category were dropped rather than padded.
#
# Batch one covers the five highest-value sources in the L.S.Design corpus:
#   direction-families.md · natural-color-and-humanization.md
#   core-principles.md · contract-schema.md · interface-copy.md

schema: design-kg/curated-nodes/1.0

# ── DIRECTION FAMILIES ────────────────────────────────────────────────
# The canonical five. A contract chooses from these; it never invents one.
# This is the node kind whose absence caused the failure that started this
# work: four families were invented while these five sat one link away.

direction_family:
  - id: dir_editorial_restraint
    name: Editorial restraint
    summary: >-
      Type-led hierarchy, deliberate measure, strong cropping, quiet surfaces,
      disciplined alignment. Distinction comes from proportion and pacing.
    signature: proportion and pacing
    evidence:
      source: ls-design-art-direction/references/direction-families.md — "Editorial restraint"

  - id: dir_precise_technical
    name: Precise technical
    summary: >-
      Structured information, calibrated density, exact labels, diagrams,
      controlled contrast, motion tied to system state.
    signature: calibrated density
    caution: Avoid decorative terminal clichés unless authentic to the product.
    evidence:
      source: ls-design-art-direction/references/direction-families.md — "Precise technical"

  - id: dir_tactile_human
    name: Tactile human
    summary: >-
      Material imagery, warm colour relationships, irregular but controlled
      composition, generous reading comfort, motion with physical continuity.
    signature: material warmth
    evidence:
      source: ls-design-art-direction/references/direction-families.md — "Tactile human"

  - id: dir_cinematic_spatial
    name: Cinematic spatial
    summary: >-
      Depth, sequence, framing, light and atmospheric media create focus.
    signature: depth and sequence
    caution: Preserve immediate comprehension, DOM content, and a lightweight fallback.
    evidence:
      source: ls-design-art-direction/references/direction-families.md — "Cinematic spatial"

  - id: dir_cultural_expressive
    name: Cultural expressive
    summary: >-
      Distinctive typography, image language, rhythm and symbols grounded in a
      real cultural or brand context.
    signature: grounded cultural rhythm
    caution: Avoid superficial borrowing.
    evidence:
      source: ls-design-art-direction/references/direction-families.md — "Cultural expressive"

# ── CONDITIONS ────────────────────────────────────────────────────────
# What a use case looks like. A direction `suits_use_case` a condition; an
# interview answer produces the same edge with provenance `chosen` rather
# than `canon`, which is how the graph learns from real decisions.

condition:
  - id: cond_audience_solo_operator
    name: A person working alone
    summary: No handoffs, no shared conventions to inherit, no team style to match.
    evidence: { source: derived from idea.yaml audience fields; first instance freelance-dashboard }

  - id: cond_content_tabular_numeric
    name: Content is mostly numbers to compare
    summary: Rates, scores, counts — where alignment carries meaning and scanning is the task.
    evidence: { source: ls-design/references/natural-color-and-humanization.md — monospace condition }

  - id: cond_content_long_prose
    name: Content is continuous reading
    summary: Measure, leading and rhythm dominate; density is a cost rather than a benefit.
    evidence: { source: ls-design/references/core-principles.md — Typography, measure guidance }

  - id: cond_platform_offline_local
    name: Runs locally, offline
    summary: No hosted backend, no telemetry; every value on screen came from this machine.
    evidence: { source: derived from idea.yaml constraints; first instance freelance-dashboard }

  - id: cond_locale_rtl
    name: Ships a right-to-left locale
    summary: Logical properties become mandatory and mirroring becomes a per-component decision.
    evidence: { source: ls-design/references/rtl-foundations.md — referenced by 11 skills }

  - id: cond_volume_sparse_then_dense
    name: Nearly empty at first, crowded later
    summary: >-
      The first week has no data and the third month has too much. One layout
      must hold both, or the empty case becomes an afterthought.
    evidence: { source: derived from idea.yaml REQ empty-state requirements }

  - id: cond_brand_established
    name: An established brand truth exists
    summary: Assets, palette or typography already decided elsewhere and outranking defaults.
    evidence: { source: ls-design/references/natural-color-and-humanization.md — "Established brand truth wins outright" }

# ── HUMANIZATION CHECKS ───────────────────────────────────────────────
# The positive half. These are the operational definition of "professional
# rather than generic", and the reason that phrase can be checked at all.

check:
  - id: chk_traceable_premise
    name: Traceable premise
    summary: Important choices trace to the audience, product, content, brand or environment.
    level: review
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Humanization gate }

  - id: chk_motif_restraint
    name: Motif restraint
    summary: One principal signature and one quieter counterpoint; repetition develops rather than stamps.
    level: review
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Humanization gate }

  - id: chk_content_led_geometry
    name: Content-led geometry
    summary: Section structure changes because the material changes, not because a template alternates.
    level: review
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Humanization gate }

  - id: chk_specific_language
    name: Specific language
    summary: Headings and labels carry product meaning; generic poetic phrases do not replace evidence.
    level: review
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Humanization gate }

  - id: chk_rhythm
    name: Rhythm
    summary: Dense and open passages, alignment and offset, deliberate pacing rather than constant spectacle.
    level: review
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Humanization gate }

  - id: chk_ordinary_state_quality
    name: Ordinary-state quality
    summary: >-
      The direction still works in navigation, specifications, forms, errors,
      loading and long content — not only in the hero. The single sharpest
      separator between professional and generic output.
    level: gate
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Humanization gate }

  - id: chk_contrast_measured
    name: Contrast measured, not assumed
    summary: Every foreground/background pair checked at 4.5:1 body, 3:1 large and interface, in both modes.
    level: gate
    evidence: { source: ls-design-contract/references/contract-schema.md — "Contrast is verified, not assumed" }

# ── PRIMITIVES ────────────────────────────────────────────────────────
# The parts a contract is assembled from.

primitive:
  - id: prim_role_border_vs_border_strong
    name: Two border roles, deliberately different
    summary: >-
      `border` is a decorative hairline between surfaces and is deliberately
      below 3:1 — a divider meeting 3:1 reads as a heavy rule. `border-strong`
      bounds an interactive control, where WCAG 1.4.11 applies, and is verified
      at 3:1.
    kind: colour-role
    evidence: { source: ls-design-contract/assets DESIGN template — Colors section }

  - id: prim_semantic_roles_not_names
    name: Token names are roles, not colours
    summary: "`primary` and `danger` survive a rebrand; `green` and `red` do not."
    kind: colour-role
    evidence: { source: ls-design-contract/references/contract-schema.md — Rules for the frontmatter }

  - id: prim_dark_by_prefix
    name: Dark mode as a prefixed twin
    summary: >-
      Dark values live in the same flat colours map under a `dark-` prefix; a
      token with no twin inherits its light value. Keeps the document inside the
      public format, which has no nested light/dark structure.
    kind: colour-role
    evidence: { source: ls-design-contract/references/contract-schema.md — Rules for the frontmatter }

  - id: prim_type_roles_not_sizes
    name: Typography roles, not sizes
    summary: >-
      Name a role — display, h1..h3, body, body-small, caption, label, mono —
      and give it family, size, weight, leading and tracking. Roles map to
      elements; raw sizes do not.
    kind: type
    evidence: { source: ls-design-contract/references/contract-schema.md — Rules for the frontmatter }

  - id: prim_measure_60_72
    name: Measure of 60 to 72 characters
    summary: >-
      Continuous body text reads best under about 80 characters a line; a serif
      tolerates slightly longer and wants slightly more leading than a sans at
      the same size. A starting target to tune, not a fixed value.
    kind: type
    evidence: { source: ls-design/references/core-principles.md — Typography }

  - id: prim_mono_for_numerics
    name: Monospace where alignment carries meaning
    summary: Correct for genuinely tabular or numeric content. Costume anywhere else.
    kind: type
    evidence: { source: ls-design/references/natural-color-and-humanization.md — three motifs }

  - id: prim_accent_has_one_job
    name: The accent has a limited job
    summary: >-
      Choose an accent family and give it one job — a primary action, a selected
      state, a focus indicator may share a relationship without becoming
      visually identical.
    kind: colour-role
    evidence: { source: ls-design/references/natural-color-and-humanization.md — Build colour from evidence }

  - id: prim_hierarchy_before_containers
    name: Hierarchy before containers
    summary: >-
      Use scale, position, contrast and spacing before borders, shadows or
      labels. Containers express grouping, interaction or material — they do not
      compensate for weak composition.
    kind: layout
    evidence: { source: ls-design/references/core-principles.md — Hierarchy }

  - id: prim_recompose_dont_shrink
    name: Recompose rather than shrink
    summary: >-
      Design for content pressure, not device labels. Recompose when the
      hierarchy demands it instead of scaling a desktop layout down.
    kind: layout
    evidence: { source: ls-design/references/core-principles.md — Responsive behavior }

  - id: prim_effects_are_materials
    name: Effects are materials
    summary: >-
      Glass, grain, blur, gradient, glow and deep shadow imply physical
      properties. Glow implies an emitted light source; use it where one is
      credible.
    kind: material
    evidence: { source: ls-design/references/core-principles.md — Color and materials }

  - id: prim_motion_communicates_state
    name: Motion communicates state
    summary: >-
      Motion must express state, continuity, hierarchy or causality. Respect
      reduced-motion, keep essential actions immediate, prevent layout shift.
    kind: motion
    evidence: { source: ls-design/references/core-principles.md — Motion }

  - id: prim_one_vocabulary
    name: One vocabulary across the product
    summary: >-
      A concept called one thing in navigation is called the same thing in a
      heading, a button, a confirmation and an error. An inconsistent name is a
      broken sign.
    kind: copy
    evidence: { source: ls-design/references/interface-copy.md — Name things as the user understands them }

  - id: prim_action_says_what_happens
    name: An action says what happens
    summary: "`Save changes`, not `Submit`. Active voice, and the verb survives into the confirmation."
    kind: copy
    evidence: { source: ls-design/references/interface-copy.md — Actions }

  - id: prim_error_states_next_step
    name: An error states what happened and what to do
    summary: >-
      In the interface's voice, attached to the thing that failed. It does not
      apologise, does not blame, and is never vague about which thing failed.
    kind: copy
    evidence: { source: ls-design/references/interface-copy.md — Failure and emptiness }

  - id: prim_empty_screen_invites_action
    name: An empty screen is an invitation to act
    summary: >-
      Say what will appear here and give the action that puts something in it.
      An empty screen saying only "No results" wastes the moment the person is
      most willing to be directed.
    kind: copy
    evidence: { source: ls-design/references/interface-copy.md — Failure and emptiness }

  - id: prim_content_provenance
    name: Content carries provenance
    summary: >-
      A field with no real source is left out of the build. Quotations,
      statistics, awards and customer names are never generated.
    kind: content
    evidence: { source: ls-design-contract/references/contract-schema.md — Content schemas }

